description = "Implement tasks incrementally — build, test, verify, commit. Add \"auto\" to run the whole plan in one approved pass."

prompt = """
Invoke the incremental-implementation skill alongside test-driven-development. The stage's standing rules live in that skill: a decision that is the user's goes through the host's user-question tool, one question per call, composed with the ask-user-question skill; domain words come from GLOSSARY.md through docs/agents/domain.md; the spec and the plan live in this repo.

## The spec folder

Find the active spec through `docs/agents/workspace.md`. Read that file to its last line: `paths.specs` names the folder of specs, and "Find the active effort" says which spec is active. When the file is missing, use `specs/`, the default, and tell the user once to run setup-brain, which writes it. The active spec's folder holds three files:

- `spec.md`: the spec.
- `tasks/plan.md`: the row table, which holds the only status of each task. The next task is the next row on its frontier: an `open` row whose `Blocked by` rows are all `resolved`.
- `tasks/todo.md`: one block per row, under the row's number, with the task's description, acceptance criteria, verification, files likely touched and scope.

`brain` means running the brain plugin's `scripts/brain.ts` with bun; `docs/agents/workspace.md` says how to find that path on this host.

## Modes

- `/build` — implement the next pending task, then stop (careful, one slice at a time).
- `/build auto` — generate the plan if needed, get a single approval, then implement every task: all the tasks on the frontier at once, each in a subagent with a worktree of its own.

The arguments select the mode. Treat `auto` (canonical) or `all` as autonomous mode; anything else (or empty) is the default single-task mode. Note: autonomous mode runs the same test-driven loop per task. It removes the human stepping between tasks, and it runs side by side the tasks that need nothing from each other.

## Default: one task

Take the next row on the frontier of the spec's `tasks/plan.md`. Then:

1. Read the row's block in `tasks/todo.md`: its acceptance criteria and its verification
2. Load relevant context (existing code, patterns, types)
3. Write a failing test for the expected behavior (RED)
4. Implement the minimum code to pass the test (GREEN)
5. Run the full test suite to check for regressions
6. Run the build to verify compilation
7. Commit the code with a descriptive message, the task's files staged by name
8. Close the row (see "Close a row") and stop

## Autonomous: the whole plan (`/build auto`)

Use this once a spec exists and you want to collapse plan + build into one run. It removes the manual stepping between tasks — not the verification. Every task still earns a passing test and its own commit.

1. Require a spec. Use the active spec from "The spec folder". A README or arbitrary doc does NOT count. If no spec is active, stop and tell the user to run /spec first — do not invent requirements.
2. Establish a clean baseline. Run `git status --porcelain`. If there are uncommitted changes outside the active spec's folder (`specs/SPEC-NNN-<slug>/` with the default paths: its `spec.md`, `tasks/plan.md` and `tasks/todo.md`), stop and ask the user to commit, stash, or confirm how to handle them. Autonomous per-task commits must not absorb unrelated local work, or the clean-rollback guarantee breaks.
3. Plan if needed. If the spec's `tasks/plan.md` holds no task row yet (a fresh plan from the template holds none), invoke the planning-and-task-breakdown skill to write the plan.
4. Single checkpoint. Present the full plan and wait for an unambiguous affirmative (e.g. "approve", "go", "yes"). Treat hedged responses ("looks reasonable", "I guess") as NOT approved. This is the only approval before the plan's own checkpoint rows — after approval, run autonomously. If you wrote the plan, commit `tasks/plan.md` and `tasks/todo.md` as a single preparatory commit now so they don't bleed into the first task's commit.
5. Run the frontier in parallel, as "Run the frontier" says, until no task is left on it or a checkpoint row stops the build. Each task runs in a clean context and a worktree of its own, so a long plan stays as sharp on the last task as on the first, and every merge is a clean rollback point.
6. Stop and ask the user (do not push through) when:
   - a test can't be made to pass, a merge conflict is more than a small overlap in a shared file, or the build breaks without an obvious fix → follow the debugging-and-error-recovery skill
   - the spec is ambiguous, or a task needs a decision the spec doesn't cover
   - a task is high-risk or irreversible — auth/permission changes, destructive data migrations, payments, deletions, deploys, anything touching secrets, or anything you can't undo with `git revert` → follow the doubt-driven-development skill and get explicit sign-off before continuing
   After the user resolves a blocker, they re-invoke /build auto — it resumes from the frontier.
7. Summarize at the end: tasks completed, tests added, commits made, how many tasks started at once in each wave and the reason wherever fewer started than could, the path of each worktree kept for a failed task, and anything skipped, flagged, or left for the user.

## Run the frontier

`brain plan --json` works out the frontier: its first wave is every `open` row whose `Blocked by` rows are all `resolved`. `criticalPath` is the longest chain of rows still to do. `maxParallel` is the cap: `max_parallel` in `docs/agents/workspace.md` (default 8), or the `BRAIN_MAX_PARALLEL` variable, which wins.

Gemini CLI gives a subagent no worktree of its own. Its subagents page names no such option (https://geminicli.com/docs/core/subagents/), and its own worktrees are whole sessions, started with `gemini --worktree` behind an experimental setting (https://geminicli.com/docs/cli/git-worktrees/). So every task runs through "The worktree fallback": this session makes the task's worktree with git from the feature branch's head, and the subagent works in that folder only.

1. Note the feature branch: `git branch --show-current`. Every task builds on the feature branch's current head, never on `main`.
2. Start every task on the frontier at once, up to the cap counted with the tasks still running. For each task, first make its worktree and run the install there (step 1 of "The worktree fallback"); before the first task starts, record this session's tree (step 2). Then call the `generalist` subagent once per task, all in one turn; Gemini CLI runs subagents in parallel (https://developers.googleblog.com/subagents-have-arrived-in-gemini-cli/). When the cap bites, start the rows on `criticalPath` first, then the rest in table order. A running task keeps its row `open`, so the frontier still lists it: leave it running.
3. Start fewer only for a reason, and tell the user that reason before you start them. A reason is a fact about the tasks or the host: two tasks that edit the same function (`sharedFiles` lists the files a wave's tasks share), or a host that runs one subagent at a time. "To be safe" is not a reason.
4. Brief each subagent with nothing from this conversation:
   - the plain-talk block from the brain plugin's `plain-talk/AGENTS-block.md` at the top of the prompt, because the host's every-turn text never reaches a subagent;
   - its base: its worktree, as step 3 of "The worktree fallback" says. Every shell command runs there; the shell tool also takes the folder as `dir_path` (https://geminicli.com/docs/tools/shell/);
   - the task's block from `tasks/todo.md`, copied whole, with the path of the spec folder and the spec section the block cites;
   - the resolved path of the brain plugin's `scripts/brain.ts`, so the subagent can run `brain`;
   - the instruction to invoke incremental-implementation and test-driven-development;
   - the rule to leave `tasks/plan.md` and `tasks/todo.md` to this session, to stage only the files the task touched, by name, and to make one commit on the branch `build/T<NN>`;
   - its result file: `T<NN>-result.md`, task ID first, in a folder outside the repo that you create for this build, holding the commit SHA, the verification command with its outcome, and any question. A subagent's file name never starts with report, summary, findings or analysis, as `docs/agents/workspace.md` says;
   - its reply: the result file's path plus one line: pass or fail, the commit SHA, and any question;
   - the rule that a decision the spec does not cover comes back as one question in its result, because a subagent cannot ask the user.
5. Merge one task at a time. When a subagent replies, check the tree first (step 4 of "The worktree fallback"). Then read its line. Read its result file only when the line says fail or asks a question; then stop (step 6 above). When several tasks have passed, take the one on `criticalPath` first:
   1. Gemini CLI has no way to message a running subagent. So when an earlier merge changed a file or an interface that this task uses, rebase it yourself now: `git -C .gemini/worktrees/T<NN> rebase <feature branch>`, then run its verification again in that folder.
   2. Merge its branch into the feature branch: `git merge --no-ff build/T<NN>`. Resolve a small overlap in a shared file yourself.
   3. Run the repo's check command on the merged head.
   4. Close the row (see "Close a row").
   5. Remove its worktree, which Gemini CLI leaves for you (step 6 of "The worktree fallback").
6. Move the frontier. After each closed row, run `brain plan --json` again, and start each task that has newly reached the frontier, as in item 2.
7. A checkpoint row on the frontier stops the build for the user's review. Start no new task, and tell the user that this is why. Let the running tasks finish, and merge them. Run the checks in the checkpoint's block, then present the checkpoint: what its phase built, and each check with its outcome. After the user's unambiguous yes, close the checkpoint row, its result the checks and the user's yes, and go on from item 6.

On a host without subagents, run the frontier's tasks one at a time in this session, and tell the user that reason once: do the task, commit, close the row, clear the context, and re-invoke /build auto; it resumes from the frontier.

## The worktree fallback

Use it when the host gives a subagent no worktree of its own. On Gemini CLI that is every task, as "Run the frontier" says.

The folder is `.gemini/worktrees/`, where `gemini --worktree` makes its own worktrees; Gemini CLI leaves each worktree for you to remove (https://geminicli.com/docs/cli/git-worktrees/). A subagent starts in this session's folder, so this session checks its own tree.

1. **Make each task's worktree from the feature branch's head**, then run the install command there: `git worktree add -b build/T<NN> .gemini/worktrees/T<NN> <feature branch>`, then `cd .gemini/worktrees/T<NN> && <install command>`. When that folder is still there from a stopped build, ask the user whether to reuse it or remove it.
2. **Record this session's tree** before the first fallback task starts: `git status --porcelain --untracked-files=all -- ':!.gemini/worktrees'`. Keep the output for the whole build. This session commits each change it makes, so a correct run never changes it.
3. **Give each task its worktree.** In place of the base, the brief names the worktree's absolute path and says: work only in that path; every file you read or write is under it; start every shell command with `cd <path> && `; the branch `build/T<NN>` already holds the feature branch's head, and the install has run; commit there. It also names the feature branch, for a rebase this session may ask for.
4. **Check the tree when a task replies**, before anything else: run the record's command again. A line the record lacks means an agent wrote in this session's tree. Then stop the build, merge nothing, and tell the user the new lines and the task that replied.
5. **Merge the branch `build/T<NN>`** as "Run the frontier" says.
6. **Remove the worktree after its merge:** `git worktree remove .gemini/worktrees/T<NN>`, then `git worktree prune`, then `git branch -d build/T<NN>`.
7. **A failed task keeps its worktree** and its branch, for the user to inspect. The stop message and the closing summary name its path, and the path of every other fallback worktree still on disk.

## Close a row

This session is the only writer of `tasks/plan.md` and of the ticks in `tasks/todo.md`. After a task's commit (`/build`) or its merge (`/build auto`):

1. Tick the boxes in the task's block of `tasks/todo.md`.
2. Set the task's row in `tasks/plan.md` to `resolved`, and write its result as the table asks: the task's commit SHA, then the verification command and its outcome.
3. Replace the text of the plan's "Parallel waves" section with the waves text of a fresh `brain plan`, everything above its `Cap:` line: a resolved row leaves the waves. A plan without the section gets one, below the Tasks table.
4. Run `brain check`. No finding may name a file in the spec folder.
5. Commit `tasks/plan.md` and `tasks/todo.md` alone, staged by name, in a commit of their own: the row's result names the task's commit, which exists only once that commit does.

If any step fails, follow the debugging-and-error-recovery skill.
"""

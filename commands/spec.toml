description = "Start spec-driven development — write a structured specification before writing code"

prompt = """
Invoke the spec-driven-development skill. The stage's standing rules live in that skill: a decision that is the user's goes through the host's user-question tool, one question per call, composed with the ask-user-question skill; domain words come from GLOSSARY.md through docs/agents/domain.md; the spec and the plan live in this repo.

Begin by understanding what the user wants to build. When the ask is underspecified, the skill runs interview-me first, one question per call. Cover:
1. The objective and target users
2. Core features and acceptance criteria
3. Tech stack preferences and constraints
4. Known boundaries (what to always do, ask first about, and never do)

Then generate a structured spec covering all six core areas: objective, commands, project structure, code style, testing strategy, and boundaries.

If the request bundles several independently testable capabilities, first propose a capability map (module ids, dependency direction, build order) per the skill's Stage 0 and get it approved, then spec each module in dependency order, each in its own spec folder.

Save each spec in its own spec folder:

1. Run `brain new-doc SPEC <slug> --title "<the spec's title>"`; `docs/agents/workspace.md` says how to run `brain` on this host. It claims the next number and writes `SPEC-NNN-<slug>/`, with `spec.md`, `tasks/plan.md` and `tasks/todo.md`, each with the title in its H1, into the folder of specs that `docs/agents/workspace.md` names. When that file is missing, new-doc uses `specs/`, the default; tell the user once to run setup-brain, which writes it.
2. Write the spec into `spec.md`, and list the IDEA, DEC and RES files it comes from in `sources:`.
3. Leave `tasks/plan.md` and `tasks/todo.md` as they are; /planning fills them.

Confirm the spec with the user before proceeding.
"""

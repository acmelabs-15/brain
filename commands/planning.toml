description = "Break work into small verifiable tasks with acceptance criteria and dependency ordering"

prompt = """
Invoke the planning-and-task-breakdown skill. The stage's standing rules live in that skill: a decision that is the user's goes through the host's user-question tool, one question per call, composed with the ask-user-question skill; domain words come from CONTEXT.md through docs/agents/domain.md; the spec and the plan live in this repo.

Read the existing spec (SPEC.md, or the module's file under spec/) and the relevant codebase sections. Then:

1. Enter plan mode — read only, no code changes
2. Identify the dependency graph between components
3. Slice work vertically (one complete path per task, not horizontal layers)
4. Write tasks with acceptance criteria and verification steps
5. Add checkpoints between phases
6. Put the three approval questions to the user through the question tool, one per call: granularity, blocking edges, merge or split. Iterate until approved

Save the plan to tasks/plan.md and task list to tasks/todo.md.

If tasks/plan.md or tasks/todo.md already exists with unchecked tasks for different work, stop and ask before writing — never silently overwrite an incomplete plan.
"""
